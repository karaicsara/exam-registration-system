# Primer lokalne konfiguracije - NE sadrzi prave kredencijale.
# application.properties vec cita vrednosti preko ${...} placeholder-a, pa je za lokalni rad
# potrebno samo postaviti sledece environment promenljive (npr. u IntelliJ Run Configuration
# -> Environment variables), bez izmene koda ili application.properties:
#
#   DB_USERNAME=root
#   DB_PASSWORD=tvoja-mysql-lozinka
#
#   MAIL_USERNAME=tvoj.nalog@gmail.com
#   MAIL_APP_PASSWORD=xxxx xxxx xxxx xxxx   (Google App Password, ne obican nalog password)
#
# Opciono:
#   SERVER_PORT=8080
#   JWT_SECRET=neki-dugacak-random-string
#   JWT_EXPIRATION_MS=43200000
#   FRONTEND_URL=http://localhost:5173
#   UPLOAD_DIR=uploads/uplate
#   MAIL_HOST=smtp.gmail.com
#   MAIL_PORT=587
#
# Baza "anastasijaprobni" se kreira i puni pokretanjem database/anastasijaprobni.sql u SQLyog-u.
